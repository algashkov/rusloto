<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>РусЛото</title>
<meta name="description" content="Весёлая игра-викторина по русскому языку: 40 бочонков, ребусы, шарады и загадки.">
<link rel="stylesheet" href="css/fonts.css?v=11">
<link rel="stylesheet" href="css/style.css?v=11">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
</head>
<body>
<div id="bg" aria-hidden="true"></div>

<button id="musicBtn" class="icon-btn music" title="Музыка">🎵</button>
<button id="soundBtn" class="icon-btn" title="Звуки">🔊</button>

<!-- Экран 1: заставка -->
<section id="intro" class="screen active">
  <div id="logo" class="logo"></div>
  <p class="tagline">Весёлая игра по русскому языку</p>
  <button id="startBtn" class="btn-3d big">Старт!</button>
</section>

<!-- Экран 2: поле с бочонками -->
<section id="board" class="screen">
  <header class="board-head">
    <img id="boardLogo" class="board-logo" src="img/logo.webp" alt="РусЛото" title="Начать заново">
  </header>
  <div id="grid" class="grid"></div>
</section>

<!-- Слайд с вопросом -->
<div id="modal" class="modal" aria-hidden="true">
  <div class="card" role="dialog" aria-modal="true">
    <div class="card-top">
      <span id="cardCat" class="cat-badge"></span>
      <span id="cardNum" class="num-badge"></span>
    </div>
    <div id="cardBody" class="card-body"></div>
    <div class="card-actions">
      <button id="answerBtn" class="btn-3d">Показать ответ</button>
      <button id="closeBtn" class="btn-3d ghost">Закрыть</button>
    </div>
  </div>
</div>

<canvas id="confetti" aria-hidden="true"></canvas>

<script src="js/images.js?v=11"></script>
<script src="js/sound.js?v=11"></script>
<script src="js/questions.js?v=11"></script>
<script src="js/app.js?v=11"></script>
</body>
</html>
